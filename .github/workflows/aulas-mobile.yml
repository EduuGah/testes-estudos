name: Aulas Mobile – build e prints

on:
  push:
    branches: [ aulas-mobile ]
    paths: [ 'android/**', 'scripts/**', '.github/workflows/aulas-mobile.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar os 6 aplicativos
        run: |
          mkdir -p prints
          gradle -p android assembleDebug --no-daemon --console=plain 2>&1 | tee prints/build.log
          ls -la android/*/build/outputs/apk/debug/*.apk | tee -a prints/build.log
          (cd android && find aula1_primeiroapp -not -path '*/build*' | sort) > prints/aula1_estrutura.txt

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Executar no emulador e capturar prints
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/capturar.py 2>&1 | tee prints/capturas.log

      - name: Salvar prints na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prints
          git commit -m "Prints gerados no emulador (run ${{ github.run_id }})" || echo "nada novo"
          git push
